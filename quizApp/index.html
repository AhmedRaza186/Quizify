<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizify | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation (Same as Leaderboard) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>Quizify</span>
                </div>
                <button class="sidebar-toggle" id="toggleSidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <nav class="menu">
                <a href="#" class="active"><i class="fas fa-home"></i> <span>Home</span></a>
                <a href="./leaderboard/leaderboard.html"><i class="fas fa-trophy"></i> <span>Leaderboard</span></a>
                <a href="#" class="disabled"><i class="fas fa-lightbulb"></i> <span>Achievements</span></a>
                <a href="./profile/profile.html"><i class="fas fa-user-circle"></i> <span>Profile</span></a>
            </nav>
            <button class="logoutBtn logout-btn">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="header">
                <div class="greetingSide">
                    <h3 id="greeting">Welcome back,</h3>
                    <h1 id="name">User</h1>
                    <p>Continue your learning journey and climb the ranks!</p>
                </div>
                <div class="dpSide">
                    <div class="circle pic"></div>
                </div>
            </header>

            <!-- Stats Overview -->
            <section class="avgScoreSection">
                <div class="avgScoreCard">
                    <div class="scoreText">
                        <p>Global Progress</p>
                        <h2 id="overallScore">0%</h2>
                        <span class="basedOn">Based on <strong class="basedOnQuizzes">0</strong> quizzes</span>
                    </div>
                    <div class="progressWrapper">
                        <div class="percentages">
                            <span>Your Performance</span>
                            <span>Avg. Score</span>
                        </div>
                        <div class="progressBar">
                            <div class="progressFill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Quiz Section -->
            <section id="quizContainer" class="quiz-explorer">
                <div class="explorer-header">
                    <h2>Explore Quizzes</h2>
                    <div class="quizCategories" id="quizCategories">
                        <!-- Categories injected here -->
                    </div>
                </div>

                <div class="subCategories">
                    <!-- Sub-categories injected here -->
                </div>

                <div class="quizCards">
                    <!-- Cards injected here -->
                </div>
            </section>
        </main>
    </div>


    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="./leaderboard/leaderboard.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>Ranks</span>
        </a>
        <a href="#quizCategories" class="fab-item">
            <i class="fas fa-play"></i>
        </a>
        <a href="./profile/profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
        <a href="#" class="nav-item logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </nav>

    <div class="overlay"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
